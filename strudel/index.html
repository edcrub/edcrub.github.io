---
layout: null
---
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strudel patterns</title>
<style>
:root{--bg:#f4f6f5;--sf:#fff;--fg:#17201d;--mut:#5b6a64;--ac:#0b7a5c;--acfg:#fff;--ln:#d8e0dc;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--sf:#16201d;--fg:#e6efeb;--mut:#8fa49b;--ac:#6fe0b8;--acfg:#07140f;--ln:#243630}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Noto Sans Thai","Sarabun",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 16px calc(24px + env(safe-area-inset-bottom,0))}
main{max-width:860px;margin:0 auto}
header{padding:22px 0 12px}
h1{margin:0;font:600 1.6rem/1.25 "Noto Serif Thai","Sarabun",Georgia,serif}
.sub{margin:4px 0 0;color:var(--mut);font-size:.9rem}
.tools{display:flex;gap:8px;margin:14px 0}
input[type=search]{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--fg)}
button,.play{font:inherit;cursor:pointer;border-radius:10px;padding:8px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--fg);text-decoration:none;display:inline-block}
button:focus-visible,.play:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.play{background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:600}
.pat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.pat h2{margin:0 0 10px;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
summary{cursor:pointer;color:var(--mut);margin-top:12px;font-size:.9rem}
pre{margin:8px 0 0;padding:12px;border-radius:8px;background:var(--bg);overflow-x:auto;max-height:340px;font:.82rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
.empty{color:var(--mut);padding:24px 0}
</style>
</head>
<body>
<main>
<header>
  <h1>Strudel patterns</h1>
  <p class="sub" id="cnt">กำลังโหลด…</p>
</header>
<div class="tools">
  <input type="search" id="q" placeholder="ค้นหาชื่อหรือโค้ด" aria-label="ค้นหา">
  <button id="rev" type="button">เรียง ก-ฮ</button>
</div>
<div id="list"></div>
<noscript><p class="empty">ต้องเปิด JavaScript เพื่อดูรายการ</p></noscript>
</main>

<script>
(function(){
var STRUDEL='https://strudel.cc/';
var EXT=/\.(txt|js|mjs|strudel)$/i;
var FILES=[{% assign files = site.static_files | where_exp: "f", "f.path contains '/strudel/patterns/'" %}{% for f in files %}"{{ f.path | relative_url }}"{% unless forloop.last %},{% endunless %}{% endfor %}];
var list=document.getElementById('list'),q=document.getElementById('q'),cnt=document.getElementById('cnt'),rev=document.getElementById('rev');
var items=[],desc=false;

function stem(p){var n=p.split('/').pop();try{n=decodeURIComponent(n)}catch(e){}return n.replace(/\.[^.]+$/,'')}
function b64(code){var b=new TextEncoder().encode(code),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}

function card(it){
  var a=document.createElement('article');a.className='pat';
  var h=document.createElement('h2');h.textContent=it.name;a.appendChild(h);
  var acts=document.createElement('div');acts.className='acts';
  var p=document.createElement('a');p.className='play';p.textContent='เล่นใน Strudel';
  p.href=STRUDEL+'#'+b64(it.code);p.target='_blank';p.rel='noopener';
  var c=document.createElement('button');c.type='button';c.textContent='คัดลอกโค้ด';
  c.onclick=function(){
    var done=function(){c.textContent='คัดลอกแล้ว';setTimeout(function(){c.textContent='คัดลอกโค้ด'},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(it.code).then(done,function(){})}
  };
  acts.appendChild(p);acts.appendChild(c);a.appendChild(acts);
  var d=document.createElement('details'),s=document.createElement('summary');s.textContent='ดูโค้ด';
  var pre=document.createElement('pre');pre.textContent=it.code;
  d.appendChild(s);d.appendChild(pre);a.appendChild(d);
  return a;
}

function render(){
  var t=q.value.trim().toLowerCase();
  var v=items.filter(function(i){return !t||i.name.toLowerCase().indexOf(t)>=0||i.code.toLowerCase().indexOf(t)>=0});
  v.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
  if(desc)v.reverse();
  rev.textContent=desc?'เรียง ฮ-ก':'เรียง ก-ฮ';
  cnt.textContent=items.length?(t?v.length+' จาก '+items.length+' รายการ':items.length+' รายการ'):'';
  list.textContent='';
  if(!v.length){var e=document.createElement('p');e.className='empty';e.textContent=items.length?'ไม่พบรายการที่ค้นหา':'ยังไม่มีแพตเทิร์น วางไฟล์ในโฟลเดอร์ strudel/patterns/';list.appendChild(e);return}
  v.forEach(function(i){list.appendChild(card(i))});
}
q.oninput=render;
rev.onclick=function(){desc=!desc;render()};

Promise.all(FILES.filter(function(f){return EXT.test(f)}).map(function(f){
  return fetch(encodeURI(f)).then(function(r){return r.ok?r.text():null}).catch(function(){return null})
    .then(function(t){return t==null?null:{name:stem(f),code:t}});
})).then(function(a){items=a.filter(Boolean);render()});
})();
</script>
</body>
</html>
